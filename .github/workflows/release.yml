# Tag a version (git tag v1.2.0 && git push --tags) to publish a GitHub release with the
# installable .plasmoid file. The tag must match "Version" in package/metadata.json, and
# CHANGELOG.md needs a "## [1.2.0] - date" section: it becomes the release notes.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}   # optional: release reminder by ntfy
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches metadata.json
        run: |
          version=$(jq -r .KPlugin.Version package/metadata.json)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but metadata.json says $version"; exit 1; }
      - name: Build the .plasmoid
        run: |
          id=$(jq -r .KPlugin.Id package/metadata.json)
          (cd package && zip -r -X "../$id.plasmoid" . -x '*/__pycache__/*')
          echo "ASSET=$id.plasmoid" >> "$GITHUB_ENV"
      - name: Take the release notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(jq -r .KPlugin.Name package/metadata.json)
          gh release create "$GITHUB_REF_NAME" "$ASSET" --title "$id ${GITHUB_REF_NAME#v}" --notes-file notes.md
      - name: Remind the owner to upload it to the KDE Store
        # The store has no upload API, so the new .plasmoid goes up by hand. Skipped in forks
        # and wherever the NTFY_TOKEN secret isn't set.
        if: env.NTFY_TOKEN != ''
        run: |
          version=${GITHUB_REF_NAME#v}
          release="https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          file="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$ASSET"
          curl -sS --fail-with-body -m 20 \
            -H "Authorization: Bearer $NTFY_TOKEN" \
            -H "Title: Sky Line $version released" \
            -H "Tags: package" \
            -H "Click: $release" \
            -H "Actions: view, Download .plasmoid, $file; view, KDE Store page, https://store.kde.org/p/2381979" \
            -d "Upload $ASSET to the KDE Store: Edit, Files, set version $version and archive the old file." \
            https://ntfy.opentokwa.org/releases
